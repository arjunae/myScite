#	MinGW Project File for use with Scintilla and SciTE
#	See https://groups.google.com/forum/#!forum/scite-interest
#	@author: Marcedo@HabMalNeFrage.de
#	Place within the folder you like to index with ctags -r

[ Common Options ]
project.name=Scintilla_SciTE
file.patterns.project=$(file.patterns.cpp);$(file.patterns.py)
project.ctag.languages=c++,c,python

# choose if you want SDK Autocomplete
# place the apifiles within Project Folder/ctags
project.sdk.api=$(project.path)$(dirSep)ctags$(dirSep)ctags.mingw.functions.api

[ various ]
open.dialog.in.file.directory=1
view.whitespace=0
ccopts=-pedantic  --std=gnu++14 -Og
cc=g++ $(ccopts)
ccc=gcc $(ccopts)

# -----------------------------------------------
# usually no changes below neccessary
# -----------------------------------------------
project.path=$(SciteDirectoryHome)
APIDir=$(SciteDefaultHome)/opt

#
# Menu Commands (Windows)
#

[ Windows ]
if PLAT_WIN
	make.cmd = nmake
	sdk.path=$(project.path)
	dirSep=\/
	
	# Tools -> make
	command.build.*=$(make.cmd)

	# Tools -> compile
	project.includes=-I $(FileDir) ../../lexilla/access -I ../../scintilla/include -I ../src -I ../include -I ../lua/include
	command.compile.*.cxx="cmd /c $(ccc) -c $(FileNameExt) -o $(FileName).o $(project.includes)"
	command.compile.*.rc="windres $(FileNameExt) $(FileName).o $(project.includes)"
	
	# Tools -> run
	command.go.*="$(SciteDirectoryHome)\..\bin\SciTE.exe $(FilePath)"
	# To make the Go command both compile (if needed) and execute, use this setting:
	command.go.needs.*=

#
# Menu Comands (GTK/Linux)
#

[ Linux ]
if PLAT_GTK
	make.cmd = make
	sdk.path=$(project.path)
	dirSep=/
		
	# Tools -> make
	command.build.*=$(make.cmd)
	command.clean.*=find ./ -name "*.o"  -delete
	
	# Tools -> compile
	project.includes=-I $(FileDir) ../../lexilla/access -I ../../scintilla/include -I ../src -I ../include -I ../lua/include
	command.compile.*.cxx=$(ccc)  -c $(FilePath) -o $(FileName).o $(project.includes)
	
	# Tools -> run
	command.go.*="$(SciteDirectoryHome)/../bin/SciTE"
	# To make the Go command both compile (if needed) and execute, use this setting:
	command.go.needs.*=


#
# Project SDK Settings (Autocomplete)
#
[ ctags ]
project.ctags.excludes=--exclude="@$(project.path)$(dirSep)ctags$(dirSep)ctags.excludes"
project.ctags.opt=--tag-relative=yes --fields=+iaS  --languages=$(project.ctag.languages) $(project.ctags.excludes) $(project.ctags.root)

import $(project.sdk.api)