#   User initialisation file for SciTE	
#   See https://groups.google.com/forum/#!forum/scite-interest

 Abbrevations 
abbreviations.$(file.patterns.cpp)=$(SciteUserHome)/opt/cpp.abbrev
abbreviations.$(file.patterns.html)=$(SciteUserHome)/opt/html.abbrev
abbreviations.$(file.patterns.haskell)=$(SciteUserHome)/opt/haskell.abbrev
abbreviations.$(file.patterns.octave)=$(SciteUserHome)/opt/octave.abbrev
abbreviations.$(file.patterns.pascal)=$(SciteUserHome)/opt/pascal.abbrev
abbreviations.$(file.patterns.smalltalk)=$(SciteUserHome)/opt/smalltalk.abbrev
