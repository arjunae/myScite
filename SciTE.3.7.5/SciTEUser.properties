# Tools 

file.patterns.uncrustify=$(file.patterns.cpp);$(file.patterns.clike);$(file.patterns.java);
command.name.2.$(file.patterns.uncrustify)=Beautify Clike
command.2.$(file.patterns.uncrustify)="(SciteDefaultHome)\tools\myAstyle.cmd" "$(FilePath)"
command.mode.2.$(file.patterns.uncrustify)=savebefore:yes

file.patterns.figref=$(file.patterns.text);
command.name.1.$(file.patterns.figref)=AsciiArtify
command.1.$(file.patterns.figref)="(SciteDefaultHome)\tools\myFigref.cmd" "$(CurrentSelection)"
command.mode.1.$(file.patterns.figref)=savebefore:no
